name: Bygg och testa APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Versionsnummer
        id: version
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Om hemligheten SNC_KEYSTORE_BASE64 finns signeras alla byggen med samma nyckel,
      # så att nya versioner kan installeras ovanpå gamla. Annars används en tillfällig nyckel.
      - name: Signeringsnyckel
        env:
          KEYSTORE_B64: ${{ secrets.SNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snc.jks"
            {
              echo "SNC_KEYSTORE=$RUNNER_TEMP/snc.jks"
              echo "SNC_KEYSTORE_PASSWORD=snc-camera"
              echo "SNC_KEY_ALIAS=snc"
              echo "SNC_KEY_PASSWORD=snc-camera"
            } >> "$GITHUB_ENV"
            echo "::notice title=Signering::Fast nyckel används"
          else
            echo "::warning title=Signering::Hemligheten SNC_KEYSTORE_BASE64 saknas – tillfällig nyckel används (avinstallera gammal version före uppdatering)"
          fi

      - name: Bygg APK för telefonen (arm64)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SNC-Camera-${{ steps.version.outputs.version }}.apk"

      - name: Bygg test-APK (alla arkitekturer, för emulatorn)
        run: |
          ./gradlew --no-daemon assembleRelease -PsncAllAbis=true
          cp app/build/outputs/apk/release/app-release.apk out/test-alla-abi.apk

      - name: Kontrollera APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="out/SNC-Camera-${{ steps.version.outputs.version }}.apk"
          INFO=$("$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code)" | tr '\n' ' ')
          SIZE=$(du -h "$APK" | cut -f1)
          echo "::notice title=APK::$SIZE – $INFO"
          "$BT/apksigner" verify "$APK" && echo "::notice title=Signatur::OK"

      - uses: actions/upload-artifact@v7
        with:
          name: SNC-Camera-apk
          path: out/SNC-Camera-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: out/test-alla-abi.apk
          retention-days: 3

  test:
    name: Röktest i emulator (Android 16)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: test-apk
          path: out

      - name: Aktivera KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Förbered Python
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true

      - name: Kör appen i emulatorn
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/smoke-test.sh out/test-alla-abi.apk ci-out

      - name: Ladda upp skärmbilder
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skarmbilder-och-testrapport
          path: ci-out
          if-no-files-found: ignore

      # Tillfälligt under granskning av designen: lägg skärmbilderna på grenen ci-results
      - name: Publicera testresultat på grenen ci-results
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          git init -q -b ci-results
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Röktest ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

  release:
    name: Publicera release
    needs: [ build, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SNC-Camera-apk
          path: out

      - name: Skapa release med APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<EOF
          **SNC Camera $VERSION** för OnePlus 13R med LineageOS 23.2.

          ### Installera
          1. Ladda ner \`SNC-Camera-$VERSION.apk\` här nedanför på telefonen.
          2. Öppna filen och tillåt installation från webbläsaren/filhanteraren om telefonen frågar.

          Byggd från ${GITHUB_SHA::7} och testad i Android 16-emulator.

          Developer: Claes Sundman S.N.C AB
          EOF
          gh release delete "v$VERSION" --cleanup-tag -y 2>/dev/null || true
          gh release create "v$VERSION" out/*.apk --title "SNC Camera $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
