name: Bygg och testa APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      fixed_key: ${{ steps.signing.outputs.fixed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Versionsnummer
        id: version
        run: echo "version=$(grep -oP '^sncAppVersionName=\K.+' gradle.properties | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Om hemligheten SNC_KEYSTORE_BASE64 finns signeras alla byggen med appens egen nyckel, så att nya
      # versioner kan installeras ovanpå gamla (även via uppdateringen i appen). Utan den byggs och testas
      # appen med en tillfällig nyckel, men ingen release publiceras (som i Direct-appen).
      - name: Signeringsnyckel
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/snc.jks"
            {
              echo "SNC_KEYSTORE=$RUNNER_TEMP/snc.jks"
              echo "SNC_KEYSTORE_PASSWORD=snc-camera"
              echo "SNC_KEY_ALIAS=snc"
              echo "SNC_KEY_PASSWORD=snc-camera"
            } >> "$GITHUB_ENV"
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signering::Appens egen nyckel används"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Signering::Hemligheten SNC_KEYSTORE_BASE64 saknas – tillfällig nyckel används och ingen release publiceras"
          fi

      - name: Bygg APK för telefonen (arm64)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SNC-Camera-${{ steps.version.outputs.version }}.apk"

      - name: Bygg test-APK (alla arkitekturer, för emulatorn)
        run: |
          # Låg version så att testet kan hitta senaste release på GitHub som en "ny version"
          ./gradlew --no-daemon assembleRelease -PsncAllAbis=true -PsncVersionName=0.9.0 -PsncVersionCode=1
          cp app/build/outputs/apk/release/app-release.apk out/test-alla-abi.apk

      - name: Kontrollera APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="out/SNC-Camera-${{ steps.version.outputs.version }}.apk"
          INFO=$("$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|native-code)" | tr '\n' ' ')
          SIZE=$(du -h "$APK" | cut -f1)
          echo "::notice title=APK::$SIZE – $INFO"
          "$BT/apksigner" verify "$APK"
          # Fingeravtrycket måste stämma med signing/cert-sha256.txt när appens egen nyckel används
          DIGEST=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(tr -d ':[:space:]' < signing/cert-sha256.txt | tr 'A-F' 'a-f')
          if [ "${{ steps.signing.outputs.fixed }}" = "true" ]; then
            if [ "$DIGEST" != "$WANT" ]; then
              echo "::error title=Signatur::APK:n är signerad med fel nyckel ($DIGEST), förväntat $WANT enligt signing/cert-sha256.txt"
              exit 1
            fi
            echo "::notice title=Signatur::OK – appens egen nyckel ($DIGEST)"
          else
            echo "::notice title=Signatur::Tillfällig nyckel ($DIGEST)"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: SNC-Camera-apk
          path: out/SNC-Camera-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: out/test-alla-abi.apk
          retention-days: 3

  test:
    name: Röktest i emulator (Android 16)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: test-apk
          path: out

      - name: Aktivera KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Förbered Python
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || true

      - name: Kör appen i emulatorn
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash .github/scripts/smoke-test.sh out/test-alla-abi.apk ci-out

      - name: Ladda upp skärmbilder
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skarmbilder-och-testrapport
          path: ci-out
          if-no-files-found: ignore

      # Tillfälligt under granskning: lägg skärmbilderna på grenen ci-results
      - name: Publicera testresultat på grenen ci-results
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          git init -q -b ci-results
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Röktest ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

  release:
    name: Publicera release
    needs: [ build, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Som i Direct-appen: en release publiceras aldrig signerad med fel nyckel,
      # annars går uppdateringen i appen inte att installera ovanpå.
      - name: Kräv appens egen signeringsnyckel
        if: needs.build.outputs.fixed_key != 'true'
        run: |
          echo "::error title=Ingen release::Hemligheten SNC_KEYSTORE_BASE64 saknas. Lägg in den under Settings → Secrets and variables → Actions och kör arbetsflödet igen (Actions → Bygg och testa APK → Run workflow)."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: SNC-Camera-apk
          path: out

      - name: Ändringar för versionen (från CHANGELOG.md)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## Version " + re.escape(v) + r"\b.*?$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else "- Ny version av SNC Camera."
          footer = (
              "\n\n---\n"
              f"Ladda ner `SNC-Camera-{v}.apk` nedan och öppna filen på telefonen, eller uppdatera direkt i appen under "
              "**Inställningar → Uppdateringar**.\n\nDeveloper: Claes Sundman S.N.C AB"
          )
          open("notes.md", "w", encoding="utf-8").write(body + footer)
          PY
          cat notes.md

      - name: Skapa release med APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Fast namn också: .../releases/latest/download/SNC-Camera.apk pekar alltid på senaste versionen
          cp "out/SNC-Camera-$VERSION.apk" out/SNC-Camera.apk
          gh release delete "v$VERSION" --cleanup-tag -y 2>/dev/null || true
          gh release create "v$VERSION" "out/SNC-Camera-$VERSION.apk" out/SNC-Camera.apk \
            --title "SNC Camera $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
